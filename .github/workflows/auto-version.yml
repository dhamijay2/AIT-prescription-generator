name: Auto-increment Version

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'VERSION'
      - 'ait gen.py'

jobs:
  increment-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Read current version
      id: version
      run: |
        VERSION=$(cat VERSION)
        echo "current_version=$VERSION" >> $GITHUB_OUTPUT
        echo "Current version: $VERSION"

    - name: Increment version
      id: increment
      run: |
        CURRENT=${{ steps.version.outputs.current_version }}
        NEW_VERSION=$(python3 << 'EOF'
        current = "${{ steps.version.outputs.current_version }}"
        major, minor = map(float, current.split('.'))
        minor += 1
        # Handle wraparound: if minor reaches 100, increment major
        if minor >= 100:
            major += 1
            minor = 0
        new_version = f"{int(major)}.{int(minor):02d}"
        print(new_version)
        EOF
        )
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "New version: $NEW_VERSION"

    - name: Update VERSION file
      run: |
        echo "${{ steps.increment.outputs.new_version }}" > VERSION

    - name: Update version in ait gen.py
      run: |
        sed -i 's/version ${{ steps.version.outputs.current_version }}/version ${{ steps.increment.outputs.new_version }}/g' "ait gen.py"

    - name: Commit version bump
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add VERSION "ait gen.py"
        git commit -m "chore: bump version to ${{ steps.increment.outputs.new_version }}" || echo "No changes to commit"

    - name: Push version bump
      run: |
        git push
